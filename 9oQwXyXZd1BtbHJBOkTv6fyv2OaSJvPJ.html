function updateTimelineStageNumbers() {

    const stages =
        document.querySelectorAll(".timelineStage");

    stages.forEach((stage, index) => {

        stage.querySelector("h3").textContent =
            `Etapa ${index + 1}`;

    });

}


function collectTimelineStages() {

    const stages =
        document.querySelectorAll(".timelineStage");

    return [...stages]
        .map(stage => ({

            title: stage
                .querySelector(".stageTitle")
                .value
                .trim(),

            date: stage
                .querySelector(".stageDate")
                .value,

            startTime: stage
                .querySelector(".stageStartTime")
                .value,

            endTime: stage
                .querySelector(".stageEndTime")
                .value,

            description: stage
                .querySelector(".stageDescription")
                .value
                .trim()

        }))
        .filter(stage =>

            stage.title !== "" ||
            stage.date !== "" ||
            stage.startTime !== "" ||
            stage.endTime !== "" ||
            stage.description !== ""

        );

}
function formatTimelineDate(value) {

    if (!value) {
        return "";
    }

    const parts = value.split("-");

    if (parts.length !== 3) {
        return value;
    }

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}


function wrapTimelineText(text, font, size, maxWidth) {

    const words = text.split(/\s+/);
    const lines = [];
    let currentLine = "";

    for (const word of words) {

        const testLine =
            currentLine === ""
                ? word
                : `${currentLine} ${word}`;

        const width =
            font.widthOfTextAtSize(testLine, size);

        if (width <= maxWidth) {

            currentLine = testLine;

        } else {

            if (currentLine !== "") {
                lines.push(currentLine);
            }

            currentLine = word;
        }
    }

    if (currentLine !== "") {
        lines.push(currentLine);
    }

    return lines;
}


function drawTimeline(page, stages, font) {

    const red = PDFLib.rgb(244 / 255, 0, 0);
    const black = PDFLib.rgb(0.08, 0.08, 0.08);

  const centerX = 297.6;

const lineTopY = 715;
const lineBottomY = 85;

// Posição do primeiro e do último ponto
const firstPointY = 680;
const lastPointY = 100;

// Distribui as etapas pela linha inteira
const distance =
    stages.length > 1
        ? (firstPointY - lastPointY) /
          (stages.length - 1)
        : 0;

page.drawLine({
    start: {
        x: centerX,
        y: lineTopY
    },
    end: {
        x: centerX,
        y: lineBottomY
    },
    thickness: 4,
    color: red
});
    
// Ponta exterior arredondada
page.drawCircle({
    x: lineEndX,
    y,
    size: 2,
    color: red
});
    
    stages.forEach((stage, index) => {

       const y =
    stages.length === 1
        ? lastPointY
        : firstPointY - (index * distance);

        const rightSide =
            index % 2 === 0;

        const lineEndX =
            rightSide
                ? centerX + 35
                : centerX - 35;

        page.drawLine({
            start: {
                x: centerX,
                y
            },
            end: {
                x: lineEndX,
                y
            },
            thickness: 4,
            color: red
        });

        page.drawCircle({
            x: centerX,
            y,
            size: 7,
            color: red
        });
        
        // Pontas redondas da linha vertical
page.drawCircle({
    x: centerX,
    y: lineTopY,
    size: 2,
    color: red
});

page.drawCircle({
    x: centerX,
    y: lineBottomY,
    size: 2,
    color: red
});

       const textWidth = 190;
const textGap = 18;

const textRightEdge =
    centerX - 35 - textGap;

const getTextX = (text, size) => {

    if (rightSide) {
        return centerX + 53;
    }

    const width =
        font.widthOfTextAtSize(
            text || "",
            size
        );

    return textRightEdge - width;
};

        if (stage.title) {

            page.drawText(stage.title, {
               x: getTextX(stage.title, 15),
                y: y + 42,
                size: 15,
                font,
                color: black,
                maxWidth: textWidth
            });
        }

        const date =
            formatTimelineDate(stage.date);

        const schedule = [
            date,
            stage.startTime && stage.endTime
                ? `${stage.startTime} - ${stage.endTime}`
                : stage.startTime || stage.endTime
        ]
            .filter(Boolean)
            .join(" | ");

        if (schedule) {

            page.drawText(schedule, {
                x: getTextX(schedule, 10),
                y: y + 18,
                size: 10,
                font,
                color: red,
                maxWidth: textWidth
            });
        }

        const descriptionLines =
            wrapTimelineText(
                stage.description || "",
                font,
                9,
                textWidth
            ).slice(0, 4);

        descriptionLines.forEach(
            (line, lineIndex) => {

                page.drawText(line, {
                    x: getTextX(line, 9),
                    y: y - 3 - (lineIndex * 13),
                    size: 9,
                    font,
                    color: black
                });
            }
        );
    });
}

    async function getFileExtension(filename) {

        try {

            return filename.split('.').pop().toLowerCase();

    }



    async function pdfToJpg(pdfBuffer, pdfPage) {

        try {

            pdfPage++

            const loadingTask = pdfjsLib.getDocument({ data: pdfBuffer });

            const pdf = await loadingTask.promise;

            const page = await pdf.getPage(pdfPage);



            const scale = 1.5;

            const viewport = page.getViewport({ scale });



            const canvas = document.createElement('canvas');

            const context = canvas.getContext('2d');

            canvas.height = viewport.height;

            canvas.width = viewport.width;



            await page.render({ canvasContext: context, viewport }).promise;



            const imgData = canvas.toDataURL('image/jpeg');



            const byteString = atob(imgData.split(',')[1]);

            const byteArray = new Uint8Array(byteString.length);

            for (let i = 0; i < byteString.length; i++) {

                byteArray[i] = byteString.charCodeAt(i);

            }



            return byteArray;

        } catch (error) {

            alert("Ocorreu um erro: " + error.message);

        }

    }



    async function createCompressedImage(imageBytes, mimeType) {

        try {

            return new Promise((resolve, reject) => {

                const image = new Image();

                const blob = new Blob([imageBytes], { type: mimeType });

                const url = URL.createObjectURL(blob);



                image.onload = () => {

                    const canvas = document.createElement('canvas');

                    const ctx = canvas.getContext('2d');

                    const maxWidth = 892;

                    const maxHeight = 892 * (image.height / image.width);



                    if (image.width > maxWidth || image.height > maxHeight) {

                        canvas.width = maxWidth;

                        canvas.height = maxHeight;

                    } else {

                        canvas.width = image.width;

                        canvas.height = image.height;

                    }



                    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);



                    canvas.toBlob((blob) => {

                        const reader = new FileReader();

                        reader.onload = () => {

                            const arrayBuffer = reader.result;

                            resolve(arrayBuffer);

                        };

                        reader.onerror = reject;

                        reader.readAsArrayBuffer(blob);

                    }, mimeType);

                };



                image.onerror = (error) => {

                    reject(error);

                };



                image.src = url;

            });

        } catch (error) {

            alert("Ocorreu um erro: " + error.message);

        }

    }



    function finish() {

        const random = Math.floor(Math.random() * 7) + 1;



        const finishHeader = `<h2 class= "center black">A processar...</h2>`;

        //inserir Logo, PDF Orçamento, Imagens Maquete e Imagens Referencia.

        const finishMenu = `

        <div class = "midContainer">

            <img class="gif" src="./assets/images/loading_${random}.gif">

        </div>`;

        const finishFooter = `

        <h3 class= "center black">Se o ficheiro for demasiado grande comprima em <a href="https://www.ilovepdf.com/pt/comprimir_pdf" target="_blank">ILovePDF.com</a></h3>`;



        ui(finishHeader, finishMenu, finishFooter);

    }



    onBegin();

</script>
